schema_version: 1

defaults:
  timeout_ms: 15000
  max_items: 50
  max_age_days: 8
  concurrency: 4
  user_agent: MorningSignal/0.1 personal-research-feed-reader

sources:
  - id: solana-status
    name: Solana Status
    homepage_url: https://status.solana.com/
    feed_url: https://status.solana.com/history.rss
    tier: 1
    kind: rss
    format: rss
    topics: [crypto_security, market_structure]
    enabled: true
    notes: 仅网络事故与维护；没有近期条目不代表采集失败，也不能单凭空 Feed 断言无事故。

  - id: agave-releases
    name: Agave Releases
    homepage_url: https://github.com/anza-xyz/agave/releases
    feed_url: https://github.com/anza-xyz/agave/releases.atom
    tier: 1
    kind: rss
    format: atom
    topics: [market_structure, crypto_security, mev]
    enabled: true
    notes: 区分 alpha、rc、testnet 和 mainnet；发布版本不等于全网已激活。

  - id: jito-solana-releases
    name: Jito-Solana Releases
    homepage_url: https://github.com/jito-foundation/jito-solana/releases
    feed_url: https://github.com/jito-foundation/jito-solana/releases.atom
    tier: 1
    kind: rss
    format: atom
    topics: [mev, market_structure, crypto_security]
    enabled: true
    notes: 官方 MEV 客户端发布；核对适用集群、上游 Agave 版本和实际部署阶段。

  - id: firedancer-releases
    name: Firedancer Releases
    homepage_url: https://github.com/firedancer-io/firedancer/releases
    feed_url: https://github.com/firedancer-io/firedancer/releases.atom
    tier: 1
    kind: rss
    format: atom
    topics: [market_structure, crypto_security, mev]
    enabled: true
    notes: 区分 Firedancer、Frankendancer 和预发布；仅收录影响性能、执行、费用或安全的实质变化。

  - id: jito-governance
    name: Jito Governance
    homepage_url: https://forum.jito.network/
    feed_url: https://forum.jito.network/latest.rss
    tier: 3
    kind: rss
    format: rss
    topics: [mev, defi, market_structure]
    enabled: true
    notes: 治理与社区线索；区分草案、投票、通过和链上执行，不能单独支持 confirmed。

  - id: jupiter-research
    name: Jupiter Research
    homepage_url: https://discuss.jup.ag/
    feed_url: https://discuss.jup.ag/latest.rss
    tier: 3
    kind: rss
    format: rss
    topics: [defi, mev, crypto_security, market_structure]
    enabled: true
    notes: 研究与社区论坛只作为线索；安全指控、经济模型提案须补查官方公告或链上证据。

  - id: syndica-research
    name: Syndica Research
    homepage_url: https://blog.syndica.io/
    feed_url: https://blog.syndica.io/rss/
    tier: 2
    kind: rss
    format: rss
    topics: [defi, mev, market_structure, crypto_security]
    enabled: true
    notes: Solana 链上活动、DeFi 与客户端研究；核对数据期间和方法，月报不能冒充当天事件。

  - id: ethereum-foundation-blog
    name: Ethereum Foundation Blog
    homepage_url: https://blog.ethereum.org/
    feed_url: https://blog.ethereum.org/feed.xml
    tier: 1
    kind: rss
    format: auto
    topics: [mev, defi, crypto_security, market_structure]
    enabled: true

  - id: flashbots-collective
    name: Flashbots Collective
    homepage_url: https://collective.flashbots.net/
    feed_url: https://collective.flashbots.net/latest.rss
    tier: 3
    kind: rss
    format: rss
    topics: [mev, market_structure, ai_finance_crypto]
    enabled: true
    notes: 社区论坛只作为线索来源，不能单独支持 confirmed。

  - id: uniswap-governance
    name: Uniswap Governance
    homepage_url: https://gov.uniswap.org/
    feed_url: https://gov.uniswap.org/latest.rss
    tier: 3
    kind: rss
    format: rss
    topics: [defi, mev, regulation]
    enabled: true
    notes: 社区论坛只作为线索来源。

  - id: aave-governance
    name: Aave Governance
    homepage_url: https://governance.aave.com/
    feed_url: https://governance.aave.com/latest.rss
    tier: 3
    kind: rss
    format: rss
    topics: [defi, crypto_security, regulation]
    enabled: true
    notes: 社区论坛只作为线索来源。

  - id: geth-releases
    name: go-ethereum Releases
    homepage_url: https://github.com/ethereum/go-ethereum/releases
    feed_url: https://github.com/ethereum/go-ethereum/releases.atom
    tier: 1
    kind: rss
    format: atom
    topics: [mev, crypto_security]
    enabled: true

  - id: openai-agents-python-releases
    name: OpenAI Agents SDK Releases
    homepage_url: https://github.com/openai/openai-agents-python/releases
    feed_url: https://github.com/openai/openai-agents-python/releases.atom
    tier: 1
    kind: rss
    format: atom
    topics: [ai_finance_crypto]
    enabled: true

  - id: federal-reserve-press
    name: Federal Reserve Press Releases
    homepage_url: https://www.federalreserve.gov/newsevents/pressreleases.htm
    feed_url: https://www.federalreserve.gov/feeds/press_all.xml
    tier: 1
    kind: rss
    format: rss
    topics: [macro, market_structure]
    enabled: true

  - id: ecb-press
    name: European Central Bank Press Releases
    homepage_url: https://www.ecb.europa.eu/press/html/index.en.html
    feed_url: https://www.ecb.europa.eu/rss/press.html
    tier: 1
    kind: rss
    format: rss
    topics: [macro, regulation]
    enabled: true

  - id: sec-press
    name: U.S. SEC Press Releases
    homepage_url: https://www.sec.gov/newsroom/press-releases
    feed_url: https://www.sec.gov/news/pressreleases.rss
    tier: 1
    kind: rss
    format: rss
    topics: [regulation, market_structure, defi]
    enabled: true

  - id: gdacs-alerts
    name: Global Disaster Alert and Coordination System
    homepage_url: https://www.gdacs.org/
    feed_url: https://www.gdacs.org/xml/rss.xml
    tier: 1
    kind: rss
    format: rss
    topics: [black_swan]
    enabled: true

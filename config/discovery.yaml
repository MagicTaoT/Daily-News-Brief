# 由发现任务和研究编辑读取；这些网页/API 不属于 RSS 采集器。
data_references:
  - id: jito-tip-floor
    url: https://bundles.jito.wtf/api/v1/bundles/tip_floor
    documentation_url: https://docs.jito.wtf/lowlatencytxnsend/
    topics: [mev, market_structure]
    usage: 核对已落地 bundle 的 tip 分位数及响应 time；单次快照不能推出全天 MEV 收入或趋势。

  - id: jito-explorer
    url: https://explorer.jito.wtf/
    topics: [mev, market_structure]
    usage: 核对 bundle、tip 和交易执行；以可访问且带时间的具体记录为准。

  - id: defillama-solana
    url: https://defillama.com/chain/solana
    api_url: https://api.llama.fi/v2/historicalChainTvl/Solana
    topics: [defi, market_structure]
    usage: 网页核对 TVL、DEX/永续成交量、稳定币规模及费用；API 仅提供每日 TVL 历史。记录统计窗口、单位和口径，区分币价变动与净流入。
